# Weekly check that repository settings match ./settings. Read-only: settings are applied manually
# with scripts/repo-settings.py apply by a repository admin.
name: Settings drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check repository settings
        run: scripts/repo-settings.py check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
